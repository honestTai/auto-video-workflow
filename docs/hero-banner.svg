<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="auto-video-workflow — Autonomous AI Video Production &amp; Douyin Publishing Pipeline">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#090910"/>
      <stop offset="0.55" stop-color="#100e1f"/>
      <stop offset="1" stop-color="#0a101d"/>
    </linearGradient>
    <radialGradient id="glowL" cx="22%" cy="18%" r="48%">
      <stop offset="0" stop-color="#8453e8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8453e8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="84%" cy="82%" r="45%">
      <stop offset="0" stop-color="#45dcc3" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#45dcc3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="52" y1="75" x2="620" y2="145" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.62" stop-color="#efeaff"/>
      <stop offset="1" stop-color="#c4abff"/>
    </linearGradient>
    <linearGradient id="headNeedle" x1="0" y1="82" x2="0" y2="296" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a8ff57"/>
      <stop offset="0.5" stop-color="#6fd3ff"/>
      <stop offset="1" stop-color="#8453e8" stop-opacity="0.35"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#8453e8" stroke-width="0.6" opacity="0.12"/>
    </pattern>
    <style>
      .f-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
      .f-mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Monaco, Consolas, monospace; }
      @keyframes scrub {
        0%   { transform: translateX(0px); }
        100% { transform: translateX(332px); }
      }
      @keyframes pulseDot {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.35; }
      }
      @keyframes s1 { 0%,18% { opacity: 1; } 24%,100% { opacity: 0.66; } }
      @keyframes s2 { 0%,16% { opacity: 0.58; } 22%,42% { opacity: 1; } 48%,100% { opacity: 0.66; } }
      @keyframes s3 { 0%,38% { opacity: 0.58; } 44%,64% { opacity: 1; } 70%,100% { opacity: 0.66; } }
      @keyframes s4 { 0%,60% { opacity: 0.58; } 66%,84% { opacity: 1; } 90%,100% { opacity: 0.66; } }
      @keyframes s5 { 0%,78% { opacity: 0.58; } 84%,100% { opacity: 1; } }
      .playhead { animation: scrub 5.6s linear infinite; }
      .live-dot { animation: pulseDot 1.8s ease-in-out infinite; }
      .b1 { animation: s1 5.6s linear infinite; }
      .b2 { animation: s2 5.6s linear infinite; }
      .b3 { animation: s3 5.6s linear infinite; }
      .b4 { animation: s4 5.6s linear infinite; }
      .b5 { animation: s5 5.6s linear infinite; }
    </style>
  </defs>

  <rect width="1200" height="340" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="22" fill="url(#grid)"/>
  <rect width="1200" height="340" rx="22" fill="url(#glowL)"/>
  <rect width="1200" height="340" rx="22" fill="url(#glowR)"/>
  <rect x="1" y="1" width="1198" height="338" rx="21" fill="none" stroke="#2c2648" stroke-width="1.5"/>

  <!-- Left Column -->
  <rect x="52" y="34" width="430" height="28" rx="14" fill="#18142c" stroke="#47357a" stroke-width="1"/>
  <circle class="live-dot" cx="69" cy="48" r="4" fill="#a8ff57"/>
  <text x="82" y="52" class="f-mono" font-size="11.5" font-weight="700" fill="#d5befe" letter-spacing="0.7">AUTONOMOUS VIDEO AGENT + DOUYIN MCP · v1.0</text>

  <text x="50" y="126" class="f-sans" font-size="54" font-weight="900" fill="url(#titleGrad)" letter-spacing="-1.6">auto-video-workflow</text>

  <!-- Inline Prompt Pill -->
  <rect x="52" y="150" width="584" height="38" rx="9" fill="#12121c" stroke="#2d2b42" stroke-width="1"/>
  <text x="68" y="174" class="f-mono" font-size="12.8" fill="#8b8ba0">$ <tspan fill="#d5befe" font-weight="700">agent</tspan> <tspan fill="#a8ff57">"复盘本号5秒跳出数据，做一期 MCP 避坑指南视频发抖音"</tspan></text>

  <text x="52" y="220" class="f-sans" font-size="15" font-weight="500" fill="#b4b4c8">数据复盘纠偏 · 全网一手搜证 · 豆包逐字配音 · motion-lib 60fps 渲染 · 自动发抖音</text>

  <!-- Bottom Feature Pills -->
  <g transform="translate(52, 250)">
    <rect x="0" y="0" width="126" height="32" rx="8" fill="#21183c" stroke="#6c44c9" stroke-width="1"/>
    <text x="63" y="20.5" text-anchor="middle" class="f-mono" font-size="11.8" font-weight="700" fill="#dfd2ff">2s/5s Bounce</text>

    <rect x="134" y="0" width="118" height="32" rx="8" fill="#261f12" stroke="#9e782f" stroke-width="1"/>
    <text x="193" y="20.5" text-anchor="middle" class="f-mono" font-size="11.8" font-weight="700" fill="#f5cf7b">10 MCP Tools</text>

    <rect x="260" y="0" width="116" height="32" rx="8" fill="#102233" stroke="#2d74a8" stroke-width="1"/>
    <text x="318" y="20.5" text-anchor="middle" class="f-mono" font-size="11.8" font-weight="700" fill="#82d8ff">Word-Aligned</text>

    <rect x="384" y="0" width="118" height="32" rx="8" fill="#291519" stroke="#a63c46" stroke-width="1"/>
    <text x="443" y="20.5" text-anchor="middle" class="f-mono" font-size="11.8" font-weight="700" fill="#ff969e">1080p · 60fps</text>

    <rect x="510" y="0" width="106" height="32" rx="8" fill="#0f2620" stroke="#2d8f74" stroke-width="1"/>
    <text x="563" y="20.5" text-anchor="middle" class="f-mono" font-size="11.8" font-weight="700" fill="#7bf2cc">Zero Pause</text>
  </g>

  <!-- Right Column: Animated Closed-Loop Pipeline Window -->
  <g>
    <rect x="684" y="30" width="472" height="280" rx="16" fill="#0d0d16" stroke="#2c2946" stroke-width="1.2"/>
    <path d="M684 46a16 16 0 0 1 16-16h440a16 16 0 0 1 16 16v18H684z" fill="#151524"/>
    <line x1="684" y1="64" x2="1156" y2="64" stroke="#26243d" stroke-width="1"/>
    <circle cx="704" cy="47" r="4.8" fill="#ff5f57"/>
    <circle cx="720" cy="47" r="4.8" fill="#febc2e"/>
    <circle cx="736" cy="47" r="4.8" fill="#28c840"/>
    <text x="756" y="51" class="f-mono" font-size="11.3" fill="#9d9ab8">auto-video-workflow · closed-loop run</text>

    <rect x="684" y="64" width="472" height="26" fill="#11111d"/>
    <line x1="684" y1="90" x2="1156" y2="90" stroke="#232138" stroke-width="1"/>
    <line x1="796" y1="64" x2="796" y2="310" stroke="#232138" stroke-width="1"/>
    <text x="700" y="81" class="f-mono" font-size="10.5" fill="#6d6a88">STAGE</text>
    <g class="f-mono" font-size="10" fill="#6d6a88">
      <text x="806" y="81">ANALYTICS</text>
      <text x="892" y="81">SCRIPT+TTS</text>
      <text x="984" y="81">RENDER 60P</text>
      <text x="1076" y="81">PUBLISH</text>
    </g>

    <!-- Stage 1 -->
    <text x="700" y="118" class="f-mono" font-size="11" fill="#a8a5c2">01.stats</text>
    <g class="b1">
      <rect x="806" y="100" width="218" height="26" rx="6" fill="#5e35b1" fill-opacity="0.38" stroke="#9b72ff" stroke-width="1.2"/>
      <text x="816" y="117" class="f-mono" font-size="10.8" font-weight="600" fill="#ede4ff">5s_bounce: 66.9% → hook fix</text>
    </g>

    <!-- Stage 2 -->
    <text x="700" y="159" class="f-mono" font-size="11" fill="#a8a5c2">02.search</text>
    <g class="b2">
      <rect x="836" y="141" width="214" height="26" rx="6" fill="#8f681d" fill-opacity="0.38" stroke="#e4b256" stroke-width="1.2"/>
      <text x="846" y="158" class="f-mono" font-size="10.8" font-weight="600" fill="#ffe4a8">douyin top + web citations</text>
    </g>

    <!-- Stage 3 -->
    <text x="700" y="200" class="f-mono" font-size="11" fill="#a8a5c2">03.tts</text>
    <g class="b3">
      <rect x="876" y="182" width="206" height="26" rx="6" fill="#115c50" fill-opacity="0.42" stroke="#45dcc3" stroke-width="1.2"/>
      <text x="886" y="199" class="f-mono" font-size="10.8" font-weight="600" fill="#b3fff0">volc-tts → timing.js lock</text>
    </g>

    <!-- Stage 4 -->
    <text x="700" y="241" class="f-mono" font-size="11" fill="#a8a5c2">04.render</text>
    <g class="b4">
      <rect x="920" y="223" width="218" height="26" rx="6" fill="#163e6c" fill-opacity="0.42" stroke="#6fd3ff" stroke-width="1.2"/>
      <text x="930" y="240" class="f-mono" font-size="10.8" font-weight="600" fill="#cdeeff">motion-lib + bgm -16 LUFS</text>
    </g>

    <!-- Stage 5 -->
    <text x="700" y="282" class="f-mono" font-size="11" fill="#a8a5c2">05.douyin</text>
    <g class="b5">
      <rect x="962" y="264" width="176" height="26" rx="6" fill="#1e5631" fill-opacity="0.45" stroke="#a8ff57" stroke-width="1.2"/>
      <text x="972" y="281" class="f-mono" font-size="10.8" font-weight="700" fill="#e2ffc4">cover 3:4 · published ✓</text>
    </g>

    <!-- Animated Playhead -->
    <g class="playhead">
      <line x1="806" y1="86" x2="806" y2="302" stroke="url(#headNeedle)" stroke-width="2"/>
      <polygon points="800,84 812,84 806,93" fill="#a8ff57"/>
      <circle cx="806" cy="93" r="3" fill="#ffffff"/>
    </g>
  </g>
</svg>
